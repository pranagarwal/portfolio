name: portfolio
description: A full-stack developer portfolio built with Flutter Web.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  http: ^1.2.2
  font_awesome_flutter: ^10.8.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # No bundled assets yet. Project images use network URLs (see PortfolioRepository).
  # When you add a local resume PDF or images later, declare them here, e.g.:
  # assets:
  #   - assets/images/
